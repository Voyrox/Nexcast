replicaCount: 1

image:
  repository: glitchedking/netcast
  tag: latest
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

rbac:
  scope: cluster
  enableMetricsApi: true

service:
  type: ClusterIP
  port: 8081

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

securityContext:
  # The published image uses a named (non-numeric) USER, which some clusters
  # cannot validate with runAsNonRoot unless a numeric UID/GID is set.
  runAsUser: 100
  runAsGroup: 100
  fsGroup: 100

config:
  backend: kubernetes
  listenAddr: ":8081"
  checkInterval: 20s
  cooldown: 60s
  metricsFallbackPolicy: scale-up-only
  observationUrl: ""

  holtWinters:
    alpha: ""
    beta: ""
    gamma: ""
    delta: ""
    horizon: ""

services:
  existingConfigMap: ""
  existingKey: services.yaml
  existingSecret: ""
  existingSecretKey: services.yaml
  yaml: |
    # Example Kubernetes inventory. Replace with your own.
    services:
      - name: api
        system_id: 0
        namespace: default
        deployment_name: my-deployment
        min_replicas: 1
        max_replicas: 10
        target_per_node: 65.0
        scale_up_step: 2
        scale_down_step: 1

extraEnv: []

dotenv:
  enabled: true
  content: ""
